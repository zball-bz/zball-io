name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # books/<slug>: each book a submodule (public repositories); its
      # pointer is the published version
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: vendor engine (rolling dist from zball-bz/Typesetter)
        run: node scripts/fetch-engine.mjs
      - name: books (the test book builds; not published)
        run: ZB_BOOK_test=test/book npx @11ty/eleventy --output="$RUNNER_TEMP/books-check"
      - name: build site
        run: npx @11ty/eleventy
      # secrets: CLOUDFLARE_API_TOKEN (a scoped API token: "Edit Cloudflare
      # Workers" on this account and the zball.io zone) and CLOUDFLARE_ACCOUNT_ID
      - name: deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
